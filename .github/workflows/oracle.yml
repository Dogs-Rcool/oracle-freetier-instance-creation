name: Try to Create OCI VM
on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *' # Automatically runs every hour in the background

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install oci python-dotenv requests paramiko

      - name: Run Instance Catcher
        env:
          OCI_USER_IN: ${{ secrets.OCI_USER_IN }}
          OCI_FINGERPRINT_IN: ${{ secrets.OCI_FINGERPRINT_IN }}
          OCI_TENANCY_IN: ${{ secrets.OCI_TENANCY_IN }}
          OCI_REGION_IN: ${{ secrets.OCI_REGION_IN }}
          OCI_KEY_IN: ${{ secrets.OCI_KEY_IN }}
        run: |
          # 1. Create the secure directory Oracle expects
          mkdir -p ~/.oci
          
          # 2. Write the private key file out to disk
          echo "$OCI_KEY_IN" > ~/.oci/private_key.pem
          chmod 600 ~/.oci/private_key.pem
          
          # 3. Dynamically generate the precise config profile the Python script reads
          echo "[DEFAULT]" > ~/.oci/config
          echo "user=$OCI_USER_IN" >> ~/.oci/config
          echo "fingerprint=$OCI_FINGERPRINT_IN" >> ~/.oci/config
          echo "tenancy=$OCI_TENANCY_IN" >> ~/.oci/config
          echo "region=$OCI_REGION_IN" >> ~/.oci/config
          echo "key_file=~/.oci/private_key.pem" >> ~/.oci/config
          
          # 4. Generate the precise .env file this specific repo script reads to populate main.py variables
          echo "OCI_USER_ID=$OCI_USER_IN" > .env
          echo "OCI_TENANCY_ID=$OCI_TENANCY_IN" >> .env
          echo "OCI_FINGERPRINT=$OCI_FINGERPRINT_IN" >> .env
          echo "OCI_REGION=$OCI_REGION_IN" >> .env
          echo "OCI_COMPARTMENT_ID=$OCI_TENANCY_IN" >> .env
          echo "OCI_SHAPE=VM.Standard.A1.Flex" >> .env
          echo "OCI_OCPUS=2" >> .env
          echo "OCI_MEMORY_IN_GBS=12" >> .env
          echo "OCI_BOOT_VOLUME_SIZE_IN_GBS=50" >> .env
          echo "DISPLAY_NAME=BeyondDepthsServer" >> .env
          echo "INSTANCES_TO_CREATE=1" >> .env
          
          # 5. Run the core process
          python main.py
