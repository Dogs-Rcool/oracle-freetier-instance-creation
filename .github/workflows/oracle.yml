name: Try to Create OCI VM
on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *' # Automatically triggers an activation run every hour in the background

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Oracle OCI CLI Engine
        run: |
          # Pulls the stable native installer engine directly from official distribution routes
          curl -sL https://githubusercontent.com | bash -s -- --accept-all-defaults
          echo "/home/runner/bin" >> $GITHUB_PATH

      - name: Deploy Secure Access Profile
        env:
          OCI_USER: ${{ secrets.OCI_USER_IN }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT_IN }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY_IN }}
          OCI_REGION: ${{ secrets.OCI_REGION_IN }}
          OCI_KEY: ${{ secrets.OCI_KEY_IN }}
        run: |
          mkdir -p ~/.oci
          echo "$OCI_KEY" > ~/.oci/private_key.pem
          chmod 600 ~/.oci/private_key.pem
          
          # Sets up the exact identity block the infrastructure layer utilizes
          echo "[DEFAULT]" > ~/.oci/config
          echo "user=$OCI_USER" >> ~/.oci/config
          echo "fingerprint=$OCI_FINGERPRINT" >> ~/.oci/config
          echo "tenancy=$OCI_TENANCY" >> ~/.oci/config
          echo "region=$OCI_REGION" >> ~/.oci/config
          echo "key_file=~/.oci/private_key.pem" >> ~/.oci/config
          chmod 600 ~/.oci/config

      - name: Run Dedicated Boot Interceptor
        env:
          OCI_TENANCY: ${{ secrets.OCI_TENANCY_IN }}
        run: |
          # 1. Pull the official account subnet configuration mapping using direct platform commands
          SUBNET_ID=$(oci network subnet list --compartment-id "$OCI_TENANCY" --query "data[0].id" --raw-output)
          IMAGE_ID=$(oci compute image list --compartment-id "$OCI_TENANCY" --operating-system "Canonical Ubuntu" --operating-system-version "22.04" --query "data[0].id" --raw-output 2>/dev/null || echo "")
          
          if [ -z "$SUBNET_ID" ] || [ "$SUBNET_ID" == "null" ]; then
            echo "Network error: Baseline public subnet missing. Please run the manual setup on the Oracle Console webpage once to create network paths."
            exit 1
          fi
          
          # Fallback structural block to catch available processing architectures
          if [ -z "$IMAGE_ID" ] || [ "$IMAGE_ID" == "null" ]; then
            IMAGE_ID=$(oci compute image list --compartment-id "$OCI_TENANCY" --shape "VM.Standard.A1.Flex" --query "data[0].id" --raw-output | head -n 1)
          fi

          # 2. Fetch Availability Domain dynamically
          AD_NAME=$(oci iam availability-domain list --query "data[0].name" --raw-output)

          echo "Identity configurations validated. Initiating slot availability scans for $AD_NAME..."
          
          # 3. Run the secure generation query directly against native endpoints
          RESPONSE=$(oci compute instance launch \
            --compartment-id "$OCI_TENANCY" \
            --availability-domain "$AD_NAME" \
            --display-name "BeyondDepthsServer" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config '{"ocpus":2,"memoryInGBs":12}' \
            --subnet-id "$SUBNET_ID" \
            --image-id "$IMAGE_ID" \
            --assign-public-ip true 2>&1)
            
          # 4. Handle data center volume notifications gracefully
          if echo "$RESPONSE" | grep -E -q "Out of capacity|LimitExceeded|TooManyRequests|404"; then
            echo "STATUS: Out of Capacity in your region. Retrying on the next hourly clock trigger."
          elif echo "$RESPONSE" | grep -q "id"; then
            echo "SUCCESS! Your high-RAM server slot has been claimed successfully."
          else
            echo "Platform Warning Log: $RESPONSE"
          fi
