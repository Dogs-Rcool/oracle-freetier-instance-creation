name: OCI Free Tier Instance Creator

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

concurrency:
  group: oci-free-tier-instance-creator
  cancel-in-progress: false

jobs:
  create-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create OCI configuration
        env:
          OCI_USER: ${{ secrets.OCI_USER_IN }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT_IN }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY_IN }}
          OCI_REGION: ${{ secrets.OCI_REGION_IN }}
          OCI_KEY: ${{ secrets.OCI_KEY_IN }}
        run: |
          set -euo pipefail

          printf '%s\n' "$OCI_KEY" > "$GITHUB_WORKSPACE/oci_api_private_key.pem"
          chmod 600 "$GITHUB_WORKSPACE/oci_api_private_key.pem"

          cat > "$GITHUB_WORKSPACE/oci_config" <<EOF
          [DEFAULT]
          user=$OCI_USER
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY
          region=$OCI_REGION
          key_file=$GITHUB_WORKSPACE/oci_api_private_key.pem
          EOF

          chmod 600 "$GITHUB_WORKSPACE/oci_config"

      - name: Configure OCI Free Tier instance
        run: |
          cat > oci.env <<EOF
          OCI_CONFIG=$GITHUB_WORKSPACE/oci_config
          OCT_FREE_AD=AD-1
          DISPLAY_NAME=BeyondDepthsServer
          OCI_COMPUTE_SHAPE=VM.Standard.A1.Flex
          SECOND_MICRO_INSTANCE=False
          REQUEST_WAIT_TIME_SECS=60
          SSH_AUTHORIZED_KEYS_FILE=$GITHUB_WORKSPACE/id_rsa.pub
          OCI_SUBNET_ID=ocid1.subnet.oc1.ap-melbourne-1.aaaaaaaaubv3oyd5ubfzr76a5irhvz2eagyoy7dpmt3tcr5maukfztg2vyea
          OCI_IMAGE_ID=
          OPERATING_SYSTEM=Canonical Ubuntu
          OS_VERSION=22.04
          ASSIGN_PUBLIC_IP=true
          BOOT_VOLUME_SIZE=50
          NOTIFY_EMAIL=False
          EMAIL=
          EMAIL_PASSWORD=
          DISCORD_WEBHOOK=
          EOF

          echo "OCI configuration ready."
          echo "Shape: VM.Standard.A1.Flex"
          echo "OS: Ubuntu 22.04"
          echo "Subnet: Minecraft_Public_Subnet"

      - name: Run repository instance creator
        run: |
          python main.py

      - name: Save SSH keys
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BeyondDepthsServer-ssh-key
          path: |
            id_rsa_private
            id_rsa.pub
          retention-days: 7

      - name: Save instance information
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BeyondDepthsServer-details
          path: |
            INSTANCE_CREATED
            setup_and_info.log
            launch_instance.log
            images_list.json
          retention-days: 7
