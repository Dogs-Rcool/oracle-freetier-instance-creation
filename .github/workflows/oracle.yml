name: OCI VM Creator

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  create-vm:
    runs-on: ubuntu-latest

    steps:
      - name: Install OCI SDK
        run: |
          python -m pip install --upgrade pip
          pip install oci

      - name: Attempt VM Creation
        env:
          OCI_USER: ${{ secrets.OCI_USER_IN }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT_IN }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY_IN }}
          OCI_REGION: ${{ secrets.OCI_REGION_IN }}
          OCI_KEY: ${{ secrets.OCI_KEY_IN }}
        run: |
          cat > script.py << 'EOF'
          import os
          import oci
          import subprocess

          config = {
              "user": os.environ["OCI_USER"].strip(),
              "fingerprint": os.environ["OCI_FINGERPRINT"].strip(),
              "tenancy": os.environ["OCI_TENANCY"].strip(),
              "region": os.environ["OCI_REGION"].strip(),
              "key_content": os.environ["OCI_KEY"]
          }

          compartment_id = config["tenancy"]

          compute = oci.core.ComputeClient(config)
          network = oci.core.VirtualNetworkClient(config)
          identity = oci.identity.IdentityClient(config)

          print("Connected to OCI")

          # Check if instance already exists
          instances = compute.list_instances(
              compartment_id
          ).data

          for inst in instances:
              if inst.display_name == "BeyondDepthsServer":
                  print("Instance already exists.")
                  exit(0)

          # Get availability domain
          ad = identity.list_availability_domains(
              compartment_id
          ).data[0].name

          print("Using AD:", ad)

          # Find Ubuntu image automatically
          images = compute.list_images(
              compartment_id,
              operating_system="Canonical Ubuntu",
              operating_system_version="24.04"
          ).data

          if not images:
              raise Exception("No Ubuntu images found")

          image = sorted(
              images,
              key=lambda x: x.time_created,
              reverse=True
          )[0]

          print("Image:", image.display_name)

          # Generate SSH key
          subprocess.run([
              "ssh-keygen",
              "-t", "rsa",
              "-N", "",
              "-f", "key"
          ], check=True)

          with open("key.pub") as f:
              pubkey = f.read()

          # Use existing subnet
          subnets = network.list_subnets(
              compartment_id
          ).data

          if not subnets:
              raise Exception(
                  "Create a subnet manually first."
              )

          subnet_id = subnets[0].id

          details = oci.core.models.LaunchInstanceDetails(
              compartment_id=compartment_id,
              availability_domain=ad,
              display_name="BeyondDepthsServer",
              shape="VM.Standard.A1.Flex",
              shape_config=oci.core.models.LaunchInstanceShapeConfigDetails(
                  ocpus=2,
                  memory_in_gbs=12
              ),
              source_details=oci.core.models.InstanceSourceViaImageDetails(
                  image_id=image.id
              ),
              create_vnic_details=oci.core.models.CreateVnicDetails(
                  subnet_id=subnet_id,
                  assign_public_ip=True
              ),
              metadata={
                  "ssh_authorized_keys": pubkey
              }
          )

          try:
              instance = compute.launch_instance(details)
              print("SUCCESS")
              print(instance.data.id)

          except oci.exceptions.ServiceError as e:
              print(f"{e.status} {e.code}")

              if "Out of capacity" in str(e.message):
                  print("No capacity, try again later.")
              else:
                  raise
          EOF

          python script.py
