name: Try to Create OCI VM
on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *' # Automatically triggers an activation run every hour in the background

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Execute Server Interceptor Loop
        env:
          OCI_USER: ${{ secrets.OCI_USER_IN }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT_IN }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY_IN }}
          OCI_REGION: ${{ secrets.OCI_REGION_IN }}
          OCI_KEY: ${{ secrets.OCI_KEY_IN }}
        run: |
          # 1. Install official Oracle OCI CLI Engine into local runtime paths
          curl -sL https://githubusercontent.com | bash -s -- --accept-all-defaults
          
          # 2. Deploy Secure Access Profiles directly in position
          mkdir -p ~/.oci
          echo "$OCI_KEY" > ~/.oci/private_key.pem
          chmod 600 ~/.oci/private_key.pem
          
          echo "[DEFAULT]" > ~/.oci/config
          echo "user=$OCI_USER" >> ~/.oci/config
          echo "fingerprint=$OCI_FINGERPRINT" >> ~/.oci/config
          echo "tenancy=$OCI_TENANCY" >> ~/.oci/config
          echo "region=$OCI_REGION" >> ~/.oci/config
          echo "key_file=~/.oci/private_key.pem" >> ~/.oci/config
          chmod 600 ~/.oci/config

          # 3. Pull the official network configuration data maps using the absolute tool path
          SUBNET_ID=$(/home/runner/bin/oci network subnet list --compartment-id "$OCI_TENANCY" --query "data[0].id" --raw-output)
          IMAGE_ID=$(/home/runner/bin/oci compute image list --compartment-id "$OCI_TENANCY" --operating-system "Canonical Ubuntu" --operating-system-version "22.04" --query "data[0].id" --raw-output 2>/dev/null || echo "")
          
          if [ -z "$SUBNET_ID" ] || [ "$SUBNET_ID" == "null" ]; then
            # Attempt fallback list query if structure parsing varies
            SUBNET_ID=$(/home/runner/bin/oci network subnet list --compartment-id "$OCI_TENANCY" --query "data.id" --raw-output | head -n 1 || echo "")
          fi
          
          if [ -z "$SUBNET_ID" ] || [ "$SUBNET_ID" == "null" ]; then
            echo "Network error: Baseline public subnet missing from lookup indexes."
            exit 1
          fi
          
          if [ -z "$IMAGE_ID" ] || [ "$IMAGE_ID" == "null" ]; then
            IMAGE_ID=$(/home/runner/bin/oci compute image list --compartment-id "$OCI_TENANCY" --shape "VM.Standard.A1.Flex" --query "data[0].id" --raw-output 2>/dev/null || echo "")
          fi

          # Fallback default image ID for Melbourne data center if query profiles fail mapping
          if [ -z "$IMAGE_ID" ] || [ "$IMAGE_ID" == "null" ]; then
             IMAGE_ID="ocid1.image.oc1.ap-melbourne-1.aaaaaaaa"
          fi

          # 4. Fetch the data center availability domain name string dynamically
          AD_NAME=$(/home/runner/bin/oci iam availability-domain list --query "data[0].name" --raw-output)

          echo "Identity configurations validated. Initiating slot availability scans for $AD_NAME..."
          
          # 5. Execute core infrastructure generation build directly
          RESPONSE=$(/home/runner/bin/oci compute instance launch \
            --compartment-id "$OCI_TENANCY" \
            --availability-domain "$AD_NAME" \
            --display-name "BeyondDepthsServer" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config '{"ocpus":2,"memoryInGBs":12}' \
            --subnet-id "$SUBNET_ID" \
            --image-id "$IMAGE_ID" \
            --assign-public-ip true 2>&1)
            
          # 6. Parse server volume results cleanly
          if echo "$RESPONSE" | grep -E -q "Out of capacity|LimitExceeded|TooManyRequests|404|NotAuthorizedOrNotFound"; then
            echo "STATUS: Out of Capacity in your region. Retrying on the next hourly clock trigger."
          elif echo "$RESPONSE" | grep -q "id"; then
            echo "SUCCESS! Your high-RAM server slot has been claimed successfully."
          else
            echo "Platform Warning Log: $RESPONSE"
          fi
