name: Try to Create OCI VM
on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *' # Automatically runs every hour in the background

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install oci

      - name: Run Instance Catcher
        env:
          # Your Secure API Login Keys
          OCI_USER: ${{ secrets.OCI_USER_IN }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT_IN }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY_IN }}
          OCI_REGION: ${{ secrets.OCI_REGION_IN }}
          OCI_KEY: ${{ secrets.OCI_KEY_IN }}
          
          # Crucial Minecraft Hardware Settings
          OCI_COMPARTMENT: ${{ secrets.OCI_TENANCY_IN }} # Uses your tenancy ID as root compartment
          OCI_SHAPE: "VM.Standard.A1.Flex"
          OCI_OCPUS: "2"
          OCI_MEMORY_IN_GBS: "12"
          OCI_BOOT_VOLUME_SIZE_IN_GBS: "50"
          
          # Operating System Configuration (Ubuntu 22.04 Minimal Minimal ARM)
          # These exact fallback parameters help the backend script jump straight to deployment execution
          OCI_IMAGE_ID: ""
          OCI_SUBNET_ID: ""
        run: |
          echo "$OCI_KEY" > ./private_key.pem
          chmod 600 ./private_key.pem
          python bot.py
