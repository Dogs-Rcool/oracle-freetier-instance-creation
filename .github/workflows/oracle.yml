name: Try to Create OCI VM
on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *' # Automatically runs every hour in the background

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install oci python-dotenv requests paramiko

      - name: Run Instance Catcher
        env:
          OCI_USER_IN: ${{ secrets.OCI_USER_IN }}
          OCI_FINGERPRINT_IN: ${{ secrets.OCI_FINGERPRINT_IN }}
          OCI_TENANCY_IN: ${{ secrets.OCI_TENANCY_IN }}
          OCI_REGION_IN: ${{ secrets.OCI_REGION_IN }}
          OCI_KEY_IN: ${{ secrets.OCI_KEY_IN }}
        run: |
          # Use Python directly to write a perfectly formatted oci_config and .env file
          python -c '
          import os
          
          # Write the private key file
          with open("private_key.pem", "w") as f:
              f.write(os.environ["OCI_KEY_IN"].strip())
          os.chmod("private_key.pem", 0o600)
          
          # Write the oci_config file exactly how the OCI SDK requires it
          config_content = (
              "[DEFAULT]\n"
              f"user={os.environ[\"OCI_USER_IN\"].strip()}\n"
              f"fingerprint={os.environ[\"OCI_FINGERPRINT_IN\"].strip()}\n"
              f"tenancy={os.environ[\"OCI_TENANCY_IN\"].strip()}\n"
              f"region={os.environ[\"OCI_REGION_IN\"].strip()}\n"
              "key_file=./private_key.pem\n"
          )
          with open("oci_config", "w") as f:
              f.write(config_content)
              
          # Write the environment runtime configurations
          env_content = (
              f"OCI_USER_ID={os.environ[\"OCI_USER_IN\"].strip()}\n"
              f"OCI_TENANCY_ID={os.environ[\"OCI_TENANCY_IN\"].strip()}\n"
              f"OCI_FINGERPRINT={os.environ[\"OCI_FINGERPRINT_IN\"].strip()}\n"
              f"OCI_REGION={os.environ[\"OCI_REGION_IN\"].strip()}\n"
              f"OCI_COMPARTMENT_ID={os.environ[\"OCI_TENANCY_IN\"].strip()}\n"
              "OCI_SHAPE=VM.Standard.A1.Flex\n"
              "OCI_OCPUS=2\n"
              "OCI_MEMORY_IN_GBS=12\n"
              "OCI_BOOT_VOLUME_SIZE_IN_GBS=50\n"
              "DISPLAY_NAME=BeyondDepthsServer\n"
              "INSTANCES_TO_CREATE=1\n"
          )
          with open(".env", "w") as f:
              f.write(env_content)
          '
          
          # Execute the core process
          python main.py
