name: OCI VM Creator

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  create-vm:
    runs-on: ubuntu-latest

    steps:
      - name: Install OCI SDK
        run: |
          python -m pip install --upgrade pip
          pip install oci

      - name: Attempt VM Creation
        env:
          OCI_USER: ${{ secrets.OCI_USER_IN }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT_IN }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY_IN }}
          OCI_REGION: ${{ secrets.OCI_REGION_IN }}
          OCI_KEY: ${{ secrets.OCI_KEY_IN }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          cat > script.py << 'EOF'
          import os
          import oci

          config = {
              "user": os.environ["OCI_USER"].strip(),
              "fingerprint": os.environ["OCI_FINGERPRINT"].strip(),
              "tenancy": os.environ["OCI_TENANCY"].strip(),
              "region": os.environ["OCI_REGION"].strip(),
              "key_content": os.environ["OCI_KEY"]
          }

          compartment_id = config["tenancy"]
          shape = "VM.Standard.A1.Flex"

          compute = oci.core.ComputeClient(config)
          network = oci.core.VirtualNetworkClient(config)
          identity = oci.identity.IdentityClient(config)

          print("Connected to OCI")
          print("Region:", config["region"])
          print("Target shape:", shape)

          # ---------------------------------------------------------
          # 1. Check whether our server already exists
          # ---------------------------------------------------------

          instances = compute.list_instances(
              compartment_id=compartment_id
          ).data

          for instance in instances:
              if (
                  instance.display_name == "BeyondDepthsServer"
                  and instance.lifecycle_state != "TERMINATED"
              ):
                  print(
                      f"Instance already exists: {instance.id}"
                  )
                  print(
                      f"State: {instance.lifecycle_state}"
                  )
                  print("Nothing to do.")
                  exit(0)

          # ---------------------------------------------------------
          # 2. Find an availability domain
          # ---------------------------------------------------------

          availability_domains = identity.list_availability_domains(
              compartment_id
          ).data

          if not availability_domains:
              raise Exception("No availability domains found.")

          ad = availability_domains[0].name

          print("Using AD:", ad)

          # ---------------------------------------------------------
          # 3. Find Ubuntu 24.04 images COMPATIBLE with A1.Flex
          # ---------------------------------------------------------

          images = compute.list_images(
              compartment_id=compartment_id,
              operating_system="Canonical Ubuntu",
              operating_system_version="24.04",
              shape=shape
          ).data

          if not images:
              raise Exception(
                  "No Ubuntu 24.04 image compatible with "
                  "VM.Standard.A1.Flex was found."
              )

          # Prefer aarch64 images explicitly.
          arm_images = [
              image for image in images
              if "aarch64" in (image.display_name or "").lower()
          ]

          if arm_images:
              images = arm_images

          image = sorted(
              images,
              key=lambda x: x.time_created or "",
              reverse=True
          )[0]

          print("Selected image:", image.display_name)
          print("Image OCID:", image.id)

          # ---------------------------------------------------------
          # 4. Verify the image actually supports the A1 shape
          # ---------------------------------------------------------

          compatible_shapes = compute.list_image_shape_compatibility_entries(
              image.id
          ).data

          compatible_shape_names = [
              entry.shape
              for entry in compatible_shapes
          ]

          if shape not in compatible_shape_names:
              raise Exception(
                  f"Safety check failed: {image.display_name} "
                  f"does not list {shape} as compatible."
              )

          print("Image compatibility check: PASSED")

          # ---------------------------------------------------------
          # 5. Get an existing subnet
          # ---------------------------------------------------------

          subnets = network.list_subnets(
              compartment_id=compartment_id
          ).data

          if not subnets:
              raise Exception(
                  "No subnet exists in this compartment."
              )

          # Prefer an available subnet.
          usable_subnets = [
              subnet for subnet in subnets
              if subnet.lifecycle_state == "AVAILABLE"
          ]

          if not usable_subnets:
              raise Exception(
                  "Subnets exist, but none are AVAILABLE."
              )

          # If there is a Minecraft subnet, use it.
          minecraft_subnets = [
              subnet for subnet in usable_subnets
              if "minecraft" in (subnet.display_name or "").lower()
          ]

          if minecraft_subnets:
              subnet = minecraft_subnets[0]
          else:
              # Refuse to silently guess if multiple unrelated
              # networks exist.
              if len(usable_subnets) > 1:
                  print("Multiple usable subnets found:")

                  for s in usable_subnets:
                      print(
                          f"  {s.display_name} -> {s.id}"
                      )

                  raise Exception(
                      "Multiple subnets found and none were "
                      "clearly identified as the Minecraft subnet. "
                      "Refusing to guess."
                  )

              subnet = usable_subnets[0]

          subnet_id = subnet.id

          print("Using subnet:", subnet.display_name)
          print("Subnet OCID:", subnet_id)

          # ---------------------------------------------------------
          # 6. SSH public key
          # ---------------------------------------------------------

          ssh_public_key = os.environ.get(
              "SSH_PUBLIC_KEY",
              ""
          ).strip()

          if not ssh_public_key:
              raise Exception(
                  "SSH_PUBLIC_KEY GitHub secret is missing."
              )

          # ---------------------------------------------------------
          # 7. Build instance request
          # ---------------------------------------------------------

          details = oci.core.models.LaunchInstanceDetails(
              compartment_id=compartment_id,
              availability_domain=ad,
              display_name="BeyondDepthsServer",
              shape=shape,

              shape_config=oci.core.models.LaunchInstanceShapeConfigDetails(
                  ocpus=2,
                  memory_in_gbs=12
              ),

              source_details=oci.core.models.InstanceSourceViaImageDetails(
                  image_id=image.id
              ),

              create_vnic_details=oci.core.models.CreateVnicDetails(
                  subnet_id=subnet_id,
                  assign_public_ip=True
              ),

              metadata={
                  "ssh_authorized_keys": ssh_public_key
              }
          )

          # ---------------------------------------------------------
          # 8. Attempt launch
          # ---------------------------------------------------------

          try:
              print("Attempting to launch VM...")

              response = compute.launch_instance(details)

              instance = response.data

              print("========================================")
              print("SUCCESS!")
              print("Instance ID:", instance.id)
              print("State:", instance.lifecycle_state)
              print("========================================")

          except oci.exceptions.ServiceError as e:

              print("========================================")
              print("OCI LAUNCH ERROR")
              print("Status:", e.status)
              print("Code:", e.code)
              print("Message:", e.message)
              print("Request ID:", e.request_id)
              print("========================================")

              message = str(e.message).lower()

              if (
                  "out of capacity" in message
                  or "capacity" in message
                  or e.code == "InternalError"
              ):
                  print(
                      "No suitable A1 capacity is currently available."
                  )
                  print(
                      "The next scheduled run will try again."
                  )
                  exit(0)

              raise

          EOF

          python script.py
