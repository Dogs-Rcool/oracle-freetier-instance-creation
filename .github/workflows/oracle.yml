name: OCI Free Tier Instance Creator

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

# Prevent two creation attempts from running simultaneously.
concurrency:
  group: oci-free-tier-instance-creator
  cancel-in-progress: false

jobs:
  create-vm:
    runs-on: ubuntu-latest

    # Give each attempt up to 55 minutes.
    # The hourly schedule then gives us another attempt.
    timeout-minutes: 55

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create OCI configuration
        env:
          OCI_USER: ${{ secrets.OCI_USER_IN }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT_IN }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY_IN }}
          OCI_REGION: ${{ secrets.OCI_REGION_IN }}
          OCI_KEY: ${{ secrets.OCI_KEY_IN }}
        run: |
          set -euo pipefail

          printf '%s\n' "$OCI_KEY" > "$GITHUB_WORKSPACE/oci_api_private_key.pem"
          chmod 600 "$GITHUB_WORKSPACE/oci_api_private_key.pem"

          cat > "$GITHUB_WORKSPACE/oci_config" <<EOF
          [DEFAULT]
          user=$OCI_USER
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY
          region=$OCI_REGION
          key_file=$GITHUB_WORKSPACE/oci_api_private_key.pem
          EOF

          chmod 600 "$GITHUB_WORKSPACE/oci_config"

          echo "OCI configuration created."

      - name: Find existing Minecraft subnet
        env:
          OCI_USER: ${{ secrets.OCI_USER_IN }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT_IN }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY_IN }}
          OCI_REGION: ${{ secrets.OCI_REGION_IN }}
          OCI_KEY: ${{ secrets.OCI_KEY_IN }}
        run: |
          set -euo pipefail

          python <<'PY'
          import oci
          import os
          import sys

          config = {
              "user": os.environ["OCI_USER"].strip(),
              "fingerprint": os.environ["OCI_FINGERPRINT"].strip(),
              "tenancy": os.environ["OCI_TENANCY"].strip(),
              "region": os.environ["OCI_REGION"].strip(),
              "key_content": os.environ["OCI_KEY"],
          }

          tenancy = config["tenancy"]

          network = oci.core.VirtualNetworkClient(config)

          subnets = network.list_subnets(
              compartment_id=tenancy
          ).data

          usable = [
              subnet for subnet in subnets
              if subnet.lifecycle_state == "AVAILABLE"
          ]

          minecraft = [
              subnet for subnet in usable
              if "minecraft" in (subnet.display_name or "").lower()
          ]

          if len(minecraft) == 1:
              subnet = minecraft[0]

          elif len(minecraft) > 1:
              print("ERROR: Multiple Minecraft subnets found:")
              for subnet in minecraft:
                  print(f"  {subnet.display_name}: {subnet.id}")
              sys.exit(1)

          elif len(usable) == 1:
              subnet = usable[0]

          else:
              print("ERROR: Could not safely determine which subnet to use.")
              print("Available subnets:")
              for subnet in usable:
                  print(f"  {subnet.display_name}: {subnet.id}")
              sys.exit(1)

          print(f"Using subnet: {subnet.display_name}")
          print(f"Subnet OCID: {subnet.id}")

          with open("subnet_id.txt", "w") as f:
              f.write(subnet.id)
          PY

      - name: Configure instance creation
        run: |
          set -euo pipefail

          SUBNET_ID="$(cat subnet_id.txt)"

          cat > oci.env <<EOF
          OCI_CONFIG=$GITHUB_WORKSPACE/oci_config
          OCT_FREE_AD=AD-1
          DISPLAY_NAME=BeyondDepthsServer
          OCI_COMPUTE_SHAPE=VM.Standard.A1.Flex
          SECOND_MICRO_INSTANCE=False
          REQUEST_WAIT_TIME_SECS=60
          SSH_AUTHORIZED_KEYS_FILE=$GITHUB_WORKSPACE/id_rsa.pub
          OCI_SUBNET_ID=$SUBNET_ID
          OCI_IMAGE_ID=
          OPERATING_SYSTEM=Canonical Ubuntu
          OS_VERSION=22.04
          ASSIGN_PUBLIC_IP=true
          BOOT_VOLUME_SIZE=50
          NOTIFY_EMAIL=False
          EMAIL=
          EMAIL_PASSWORD=
          DISCORD_WEBHOOK=
          EOF

          echo "Instance configuration:"
          grep -E '^(OCT_FREE_AD|DISPLAY_NAME|OCI_COMPUTE_SHAPE|REQUEST_WAIT_TIME_SECS|OCI_SUBNET_ID|OPERATING_SYSTEM|OS_VERSION|ASSIGN_PUBLIC_IP|BOOT_VOLUME_SIZE)=' oci.env

      - name: Attempt A1 instance creation
        run: |
          python main.py

      - name: Save generated SSH key
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BeyondDepthsServer-ssh-key
          path: |
            id_rsa_private
            id_rsa.pub
          retention-days: 7

      - name: Save creation information
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BeyondDepthsServer-details
          path: |
            INSTANCE_CREATED
            setup_and_info.log
            launch_instance.log
            images_list.json
          retention-days: 7
