name: Try to Create OCI VM
on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *' # Automatically triggers an activation run every hour in the background

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Execute Server Interceptor Loop
        env:
          OCI_USER: ${{ secrets.OCI_USER_IN }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT_IN }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY_IN }}
          OCI_REGION: ${{ secrets.OCI_REGION_IN }}
          OCI_KEY: ${{ secrets.OCI_KEY_IN }}
          SUPPRESS_API_KEY_WARNING: "True" # Silences key security prompts cleanly
        run: |
          # 1. Install Oracle OCI CLI instantly
          pip install oci-cli
          
          # 2. Deploy Secure Access Profiles
          mkdir -p ~/.oci
          echo "$OCI_KEY" > ~/.oci/private_key.pem
          chmod 600 ~/.oci/private_key.pem
          
          echo "[DEFAULT]" > ~/.oci/config
          echo "user=$OCI_USER" >> ~/.oci/config
          echo "fingerprint=$OCI_FINGERPRINT" >> ~/.oci/config
          echo "tenancy=$OCI_TENANCY" >> ~/.oci/config
          echo "region=$OCI_REGION" >> ~/.oci/config
          echo "key_file=~/.oci/private_key.pem" >> ~/.oci/config
          chmod 600 ~/.oci/config

          echo "Scanning configuration mapping balances..."
          SUBNET_ID=$(oci network subnet list --compartment-id "$OCI_TENANCY" --query "data[0].id" --raw-output 2>/dev/null || echo "")

          # 3. Handle Auto-Network Checks With Force Bypasses
          if [ -z "$SUBNET_ID" ] || [ "$SUBNET_ID" == "null" ] || [ "$SUBNET_ID" == "" ]; then
            echo "No network found. Building automated Virtual Cloud Network (VCN)..."
            VCN_ID=$(oci network vcn create --compartment-id "$OCI_TENANCY" --cidr-block "10.0.0.0/16" --display-name "Minecraft_Network" --query "data.id" --raw-output)
            
            echo "Building standard public subnet structures..."
            SUBNET_ID=$(oci network subnet create --compartment-id "$OCI_TENANCY" --vcn-id "$VCN_ID" --cidr-block "10.0.0.0/24" --display-name "Minecraft_Public_Subnet" --query "data.id" --raw-output)
            
            echo "Deploying internet gateway configuration..."
            IG_ID=$(oci network internet-gateway create --compartment-id "$OCI_TENANCY" --vcn-id "$VCN_ID" --is-enabled true --display-name "Minecraft_Gateway" --query "data.id" --raw-output)
            RT_ID=$(oci network vcn get --vcn-id "$VCN_ID" --query "data.\"default-route-table-id\"" --raw-output)
            
            # The Critical Fix: Added --force override flag to stop the interactive prompt crash
            oci network route-table update --rt-id "$RT_ID" --route-rules "[{\"cidrBlock\":\"0.0.0.0/0\",\"nextHopIds\":\"$IG_ID\"}]" --force > /dev/null
          else
            echo "Verified active network configuration found: $SUBNET_ID"
          fi

          # 4. Use the absolute fallback image ID string directly to prevent image API scanning bugs
          IMAGE_ID="ocid1.image.oc1.ap-melbourne-1.aaaaaaaaaxmpxmvyq3y34mzyoxbbykxl23hmdskg7xby6pxt4b7f43y2jmaq"

          # 5. Fetch Availability Domain data string dynamically
          AD_NAME=$(oci iam availability-domain list --query "data[0].name" --raw-output 2>/dev/null || oci iam availability-domain list --query "data.name" --raw-output)

          echo "Network configurations locked. Initiating server slot allocation scans for $AD_NAME..."
          
          # 6. Request the server build directly from native endpoints
          RESPONSE=$(oci compute instance launch \
            --compartment-id "$OCI_TENANCY" \
            --availability-domain "$AD_NAME" \
            --display-name "BeyondDepthsServer" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config '{"ocpus":2,"memoryInGBs":12}' \
            --subnet-id "$SUBNET_ID" \
            --image-id "$IMAGE_ID" \
            --assign-public-ip true 2>&1)
            
          # 7. Check server volume results cleanly
          if echo "$RESPONSE" | grep -E -q "Out of capacity|LimitExceeded|TooManyRequests|404|NotAuthorizedOrNotFound"; then
            echo "STATUS: Out of Capacity in Melbourne. Automated script successfully completed this hours attempt and will cycle again on the next hour."
          elif echo "$RESPONSE" | grep -q "id"; then
            echo "SUCCESS! Your 12GB high-performance server slot has been claimed successfully!"
          else
            echo "Oracle Cloud Infrastructure Response Profile: $RESPONSE"
          fi
