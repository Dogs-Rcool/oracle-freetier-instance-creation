name: Try to Create OCI VM
on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *' # Automatically runs every hour in the background

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install oci

      - name: Run Instance Catcher
        env:
          OCI_USER: ${{ secrets.OCI_USER_IN }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT_IN }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY_IN }}
          OCI_REGION: ${{ secrets.OCI_REGION_IN }}
          OCI_KEY: ${{ secrets.OCI_KEY_IN }}
        run: |
          python -c '
          import os, oci
          
          # Initialize the connection purely from memory, skipping all config files entirely
          config = {
              "user": os.environ["OCI_USER"].strip(),
              "fingerprint": os.environ["OCI_FINGERPRINT"].strip(),
              "tenancy": os.environ["OCI_TENANCY"].strip(),
              "region": os.environ["OCI_REGION"].strip(),
              "key_content": os.environ["OCI_KEY"].strip()
          }
          
          print("Connecting to Oracle API...")
          compute_client = oci.core.ComputeClient(config)
          
          # Configure the exact Always-Free Ampere spec requirements for Beyond Depths
          instance_details = oci.core.models.LaunchInstanceDetails(
              compartment_id=config["tenancy"],
              shape="VM.Standard.A1.Flex",
              display_name="BeyondDepthsServer",
              shape_config=oci.core.models.LaunchInstanceShapeConfigDetails(ocpus=2, memory_in_gbs=12)
          )
          
          print("Scanning for open slots in your region...")
          try:
              # This sends a direct request bypassing any broken third-party repositories
              compute_client.launch_instance(instance_details)
              print("SUCCESS! Your high-RAM server slot has been claimed successfully.")
          except oci.exceptions.ServiceError as e:
              if e.status == 404 or "Out of capacity" in str(e.message):
                  print(f"STATUS: Out of Capacity in your region. Retrying on the next hourly clock trigger.")
              else:
                  print(f"Oracle Error Code: {e.code} - {e.message}")
          '
